receivers:
  otlp:
    protocols:
      http:
      grpc:

exporters:
  azuremonitor:
    instrumentation_key: "${APPINSIGHTS_INSTRUMENTATIONKEY}"
  logging:
    logLevel: info

processors:
  batch: {}
  resource:
    attributes:
      - key: service.namespace
        action: upsert
        value: novacommerce
      - key: deployment.environment
        action: upsert
        value: ${ENVIRONMENT}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [azuremonitor, logging]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [azuremonitor, logging]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [azuremonitor, logging]
