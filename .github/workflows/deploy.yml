name: Deploy to GKE

on:
  push:
    branches: [ main-developers ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      matrix:
        service: [sales, inventory, identity, gateway, catalog, payments, users-auth, outbox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: '${{ secrets.GKE_CLUSTER }}'
          location: '${{ secrets.GKE_REGION }}'

      - name: Load secrets from Secret Manager
        run: |
          echo "SQL_CONNECTION_STRING=$(gcloud secrets versions access latest --secret=sql-connection-string)" >> $GITHUB_ENV
          echo "SQL_PASSWORD=$(gcloud secrets versions access latest --secret=sql-password)" >> $GITHUB_ENV
          echo "REDIS_CONNECTION_STRING=$(gcloud secrets versions access latest --secret=redis-connection-string)" >> $GITHUB_ENV
          echo "RABBITMQ_USER=$(gcloud secrets versions access latest --secret=rabbitmq-user)" >> $GITHUB_ENV
          echo "RABBITMQ_PASSWORD=$(gcloud secrets versions access latest --secret=rabbitmq-password)" >> $GITHUB_ENV
          echo "JWT_SECRET=$(gcloud secrets versions access latest --secret=jwt-secret)" >> $GITHUB_ENV
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV

      - name: Create/Update Kubernetes Secrets
        run: |
          SERVICE_NAME=${{ matrix.service }}
          case "$SERVICE_NAME" in
            sales)
              kubectl create secret generic sales-secrets -n default \
                --from-literal=ConnectionStrings__Default="$SQL_CONNECTION_STRING" \
                --from-literal=Sql__Password="$SQL_PASSWORD" \
                --from-literal=RabbitMQ__User="$RABBITMQ_USER" \
                --from-literal=RabbitMQ__Password="$RABBITMQ_PASSWORD" \
                --from-literal=Jwt__Secret="$JWT_SECRET" \
                --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;
            inventory)
              kubectl create secret generic inventory-secrets -n default \
                --from-literal=ConnectionStrings__Default="$SQL_CONNECTION_STRING" \
                --from-literal=Sql__Password="$SQL_PASSWORD" \
                --from-literal=Redis__Connection="$REDIS_CONNECTION_STRING" \
                --from-literal=RabbitMQ__User="$RABBITMQ_USER" \
                --from-literal=RabbitMQ__Password="$RABBITMQ_PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;
            identity)
              kubectl create secret generic identity-secrets -n default \
                --from-literal=ConnectionStrings__Default="$SQL_CONNECTION_STRING" \
                --from-literal=Sql__Password="$SQL_PASSWORD" \
                --from-literal=Jwt__Secret="$JWT_SECRET" \
                --from-literal=Redis__Connection="$REDIS_CONNECTION_STRING" \
                --from-literal=RabbitMQ__User="$RABBITMQ_USER" \
                --from-literal=RabbitMQ__Password="$RABBITMQ_PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;
            gateway)
              kubectl create secret generic gateway-secrets -n default \
                --from-literal=Jwt__Secret="$JWT_SECRET" \
                --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;
            catalog)
              kubectl create secret generic catalog-secrets -n default \
                --from-literal=ConnectionStrings__Default="$SQL_CONNECTION_STRING" \
                --from-literal=Sql__Password="$SQL_PASSWORD" \
                --from-literal=Redis__Connection="$REDIS_CONNECTION_STRING" \
                --from-literal=RabbitMQ__User="$RABBITMQ_USER" \
                --from-literal=RabbitMQ__Password="$RABBITMQ_PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;
            payments)
              kubectl create secret generic payments-secrets -n default \
                --from-literal=ConnectionStrings__Default="$SQL_CONNECTION_STRING" \
                --from-literal=Sql__Password="$SQL_PASSWORD" \
                --from-literal=RabbitMQ__User="$RABBITMQ_USER" \
                --from-literal=RabbitMQ__Password="$RABBITMQ_PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;
            users-auth)
              kubectl create secret generic users-auth-secrets -n default \
                --from-literal=ConnectionStrings__Default="$SQL_CONNECTION_STRING" \
                --from-literal=Sql__Password="$SQL_PASSWORD" \
                --from-literal=Jwt__Secret="$JWT_SECRET" \
                --from-literal=RabbitMQ__User="$RABBITMQ_USER" \
                --from-literal=RabbitMQ__Password="$RABBITMQ_PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;
            outbox)
              kubectl create secret generic outbox-secrets -n default \
                --from-literal=ConnectionStrings__Default="$SQL_CONNECTION_STRING" \
                --from-literal=Sql__Password="$SQL_PASSWORD" \
                --from-literal=RabbitMQ__User="$RABBITMQ_USER" \
                --from-literal=RabbitMQ__Password="$RABBITMQ_PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;
          esac

      - name: Deploy with Helm
        run: |
          SERVICE_NAME=${{ matrix.service }}
          CHART_PATH="./infrastructure/helm/$SERVICE_NAME"
          helm upgrade --install $SERVICE_NAME $CHART_PATH -f $CHART_PATH/values.yaml --namespace default --wait

      - name: Rollout validation
        run: |
          SERVICE_NAME=${{ matrix.service }}
          kubectl rollout status deployment/$SERVICE_NAME -n default
