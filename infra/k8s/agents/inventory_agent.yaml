# Inventory Agent Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
 name: inventory-agent
spec:
 replicas:1
 selector:
 matchLabels:
 app: inventory-agent
 template:
 metadata:
 labels:
 app: inventory-agent
 spec:
 containers:
 - name: inventory-agent
 image: inventory_agent:latest # Built with Podman
 ports:
 - containerPort:80
