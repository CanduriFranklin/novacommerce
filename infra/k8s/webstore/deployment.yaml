# Webstore Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
 name: webstore
spec:
 replicas:1
 selector:
 matchLabels:
 app: webstore
 template:
 metadata:
 labels:
 app: webstore
 spec:
 containers:
 - name: webstore
 image: webstore:latest # Built with Podman
 ports:
 - containerPort:80
