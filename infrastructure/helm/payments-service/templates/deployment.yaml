apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  labels:
    app.kubernetes.io/name: payments-service
    app.kubernetes.io/instance: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-service
      app.kubernetes.io/instance: default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-service
        app.kubernetes.io/instance: default
    spec:
      containers:
        - name: payments-service
          image: "ghcr.io/your-org/payments-service:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
