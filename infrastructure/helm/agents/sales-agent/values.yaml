# Default values for sales-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: sales-agent
  pullPolicy: IfNotPresent
  # Overridden by the CI/CD pipeline
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: RABBITMQ__USER
    valueFrom:
      secretKeyRef:
        name: rabbitmq-user
        key: rabbitmq-user
  - name: RABBITMQ__PASSWORD
    valueFrom:
      secretKeyRef:
        name: rabbitmq-password
        key: rabbitmq-password
  - name: RABBITMQ__HOST
    value: "rabbitmq"
  - name: RABBITMQ__PORT
    value: "5672"
  - name: PROJECT_ID
    value: "{{ .Values.global.projectId }}"
  - name: GKE_REGION
    value: "{{ .Values.global.gkeRegion }}"
  - name: GKE_CLUSTER
    value: "{{ .Values.global.gkeCluster }}"

livenessProbe:
  enabled: true
  exec:
    command:
      - /bin/sh
      - -c
      - "true" # A simple command to check if the container is running
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  exec:
    command:
      - /bin/sh
      - -c
      - "true" # A simple command to check if the container is ready
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
