image:
  repository: ghcr.io/your-org/nl-sql-agent
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

egress:
  allowedHosts:
    - "sql-readonly.example.database.windows.net"
