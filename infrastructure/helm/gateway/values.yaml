# Default values for gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: gateway
  pullPolicy: IfNotPresent
  # Overridden by the CI/CD pipeline
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory:
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: AUTH__JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: jwt-secret
        key: jwt-secret
  - name: AUTH__ISSUER
    value: "NovaCommerce"
  - name: AUTH__AUDIENCE
    value: "NovaCommerce"
  - name: HEALTHCHECKS__IDENTITY__URI
    value: "http://identity-service/health/ready" # Assuming identity service is named identity-service
  - name: HEALTHCHECKS__CATALOG__URI
    value: "http://catalog-service/health/ready" # Assuming catalog service is named catalog-service
  # Example Ocelot configuration via environment variables
  # This needs to be carefully constructed based on your Ocelot routes
  # For a single route:
  # - name: OCELOT__ROUTES__0__UPSTREAMPATH
  #   value: "/catalog/{everything}"
  # - name: OCELOT__ROUTES__0__UPSTREAMHTTPMETHOD__0
  #   value: "GET"
  # - name: OCELOT__ROUTES__0__DOWNSTREAMPATH
  #   value: "/api/v1/catalog/{everything}"
  # - name: OCELOT__ROUTES__0__DOWNSTREAMHOSTS__0__HOST
  #   value: "catalog-service"
  # - name: OCELOT__ROUTES__0__DOWNSTREAMHOSTS__0__PORT
  #   value: "80"
  # - name: OCELOT__ROUTES__0__AUTHENTICATIONOPTIONS__AUTHENTICATIONSCHEME
  #   value: "Bearer"
  - name: PROJECT_ID
    value: "{{ .Values.global.projectId }}"
  - name: GKE_REGION
    value: "{{ .Values.global.gkeRegion }}"
  - name: GKE_CLUSTER
    value: "{{ .Values.global.gkeCluster }}"

livenessProbe:
  enabled: true
  path: /health/live
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  path: /health/ready
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
